<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Database</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #38bdf8; font-size: 1.4rem; margin: 10px 0 20px; }
    .wrap { width: 100%; max-width: 640px; }

    .search {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .list {
      background: #1e293b;
      border-radius: 12px;
      padding: 8px;
      max-height: 75vh;
      overflow-y: auto;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #0f172a;
      gap: 10px;
    }
    .item:last-child { border-bottom: none; }
    .item .word { color: #4ade80; font-weight: bold; font-size: 15px; }
    .item .cat { color: #64748b; font-size: 11px; margin-left: 6px; }
    .item .desc { color: #94a3b8; font-size: 13px; margin-top: 4px; }
    .item button {
      background: #2563eb;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
    }
    .back {
      display: inline-block;
      margin-top: 16px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>📚 Sign Database</h1>

  <div class="wrap">
    <input class="search" id="search" placeholder="Search a letter or word..." oninput="render()" />
    <div class="list" id="list"></div>
  </div>

  <a class="back" href="index.html">← Back to Translator</a>

  <script>
    // ===== YOUR DATABASE =====
    const DATA = [
      { word: "A", cat: "letter", desc: "Fist, thumb beside index" },
      { word: "B", cat: "letter", desc: "Flat hand, fingers up" },
      { word: "C", cat: "letter", desc: "Curved hand like C" },
      { word: "D", cat: "letter", desc: "Index up, others touch thumb" },
      { word: "E", cat: "letter", desc: "Fingers bent to thumb" },
      { word: "F", cat: "letter", desc: "Thumb + index touch, others up" },
      { word: "G", cat: "letter", desc: "Index pointing sideways" },
      { word: "H", cat: "letter", desc: "Two fingers pointing sideways" },
      { word: "I", cat: "letter", desc: "Pinky up" },
      { word: "J", cat: "letter", desc: "Pinky draws a J" },
      { word: "K", cat: "letter", desc: "Index + middle up, thumb between" },
      { word: "L", cat: "letter", desc: "L shape with thumb + index" },
      { word: "M", cat: "letter", desc: "Thumb under three fingers" },
      { word: "N", cat: "letter", desc: "Thumb under two fingers" },
      { word: "O", cat: "letter", desc: "Fingers curved to thumb" },
      { word: "P", cat: "letter", desc: "Like K, pointing down" },
      { word: "Q", cat: "letter", desc: "Like G, pointing down" },
      { word: "R", cat: "letter", desc: "Index + middle crossed" },
      { word: "S", cat: "letter", desc: "Fist, thumb over fingers" },
      { word: "T", cat: "letter", desc: "Thumb between index + middle" },
      { word: "U", cat: "letter", desc: "Index + middle together" },
      { word: "V", cat: "letter", desc: "Index + middle apart" },
      { word: "W", cat: "letter", desc: "Three fingers up" },
      { word: "X", cat: "letter", desc: "Index bent like hook" },
      { word: "Y", cat: "letter", desc: "Thumb + pinky out" },
      { word: "Z", cat: "letter", desc: "Index draws a Z" },

      // Words
      { word: "Hello", cat: "word", desc: "Wave open hand near head" },
      { word: "Thank You", cat: "word", desc: "Fingers from chin forward" },
      { word: "Please", cat: "word", desc: "Flat hand circles on chest" },
      { word: "Yes", cat: "word", desc: "Fist nodding like a head" },
      { word: "No", cat: "word", desc: "Index + middle tap thumb" },
    ];

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const list = document.getElementById('list');

      const filtered = DATA.filter(item =>
        !q ||
        item.word.toLowerCase().includes(q) ||
        item.desc.toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        list.innerHTML = '<p style="color:#94a3b8;padding:14px;text-align:center;">No results.</p>';
        return;
      }

      list.innerHTML = filtered.map(item => `
        <div class="item">
          <div>
            <span class="word">${item.word}</span>
            <span class="cat">[${item.cat}]</span>
            <div class="desc">${item.desc}</div>
          </div>
          <button onclick="speak('${item.word}')">🔊</button>
        </div>
      `).join('');
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0;
      window.speechSynthesis.speak(u);
    }

    render();
  </script>
</body>
</html>
